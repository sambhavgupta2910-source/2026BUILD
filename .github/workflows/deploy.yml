name: Deploy APEX Charters

on:
  push:
    branches: [claude/private-charter-booking-app-9CRUv, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: charter-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: charter-app

      - name: Build
        run: npm run build
        working-directory: charter-app
        env:
          VITE_BASE_PATH: /2026BUILD/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: charter-app/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
